<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SÚPER ESPECIAL - Live Timing</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0B0B0B;--panel:#141417;--line:#2a2a31;--cy:#6EC7FF;--vi:#1F6FD6;--tx:#fff;--mu:#b4b4bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;margin:0}
.sp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:normal;font-weight:800;letter-spacing:.01em}
.it{font-style:italic}
.ttl{font-family:Orbitron,'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.hero{background:linear-gradient(100deg,#0B0B0B 30%,#0d2a4d 100%);border-bottom:3px solid var(--cy)}
/* Filtro de categoria: mismo estilo que la etiqueta junto al nombre, pero invertido. Sin elegir = relleno con letra negra; elegido = solo borde. */
.chip{font-family:'Barlow Condensed','Arial Narrow',sans-serif;background:var(--cy);color:#001526;border:1.5px solid var(--cy);padding:.15rem .8rem;border-radius:.3rem;font-weight:800;font-style:italic;cursor:pointer;line-height:1.35}
.pebtn{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:1.05rem;background:transparent;color:var(--cy);border:1.5px solid var(--line);padding:.1rem .85rem;border-radius:.3rem;cursor:pointer;line-height:1.35}
.pebtn:hover{border-color:var(--cy)}.pebtn[aria-pressed=true]{background:var(--cy);color:#001526;border-color:var(--cy)}.pebtn.back{color:#fff;margin-right:.6rem}
#pebar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.9rem}#pebar[hidden]{display:none}
th.pe-h{cursor:pointer;color:var(--cy);text-decoration:underline dotted;text-underline-offset:3px}th.pe-h:hover,th.pe-h:focus-visible{color:#fff}
.pdfbtn{font-family:'Barlow Condensed','Arial Narrow',sans-serif;background:transparent;color:var(--cy);border:1.5px solid var(--cy);padding:.15rem .9rem;border-radius:.3rem;font-weight:800;font-size:1.05rem;cursor:pointer;line-height:1.35}.pdfbtn:hover{background:var(--cy);color:#001526}.pdfbtn:disabled{opacity:.6;cursor:wait}.pdfbtn[hidden]{display:none}
.chip[aria-pressed=true]{background:transparent;color:var(--cy);box-shadow:0 0 0 3px rgba(110,199,255,.28)}
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:.6rem 1.1rem;font-size:1.05rem;line-height:1.2;color:var(--mu);border-bottom:5px solid transparent;background:none;cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;border-color:var(--vi)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{font-weight:600;font-size:.8rem;color:var(--mu);text-align:center;white-space:nowrap;background:#101013;position:sticky;top:0}
td{text-align:center;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stick{position:sticky;left:0;text-align:left;background:var(--bg);z-index:2;min-width:14rem}
th.stick{background:#101013;z-index:3}
tr:hover td{background:#17171b} tr:hover td.stick{background:#17171b}
.best{color:var(--cy);font-weight:600}
.pn{display:block;color:#ff9f43;font-size:.7rem;line-height:1.1}
.flag{display:inline-block;width:1.75rem;height:auto;border-radius:.15rem;box-shadow:0 0 0 1px #3a3a43;margin:0 .15rem;vertical-align:middle}
.veh{display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.veh img{width:1.5rem;height:1.5rem;object-fit:contain}
.num{display:inline-block;min-width:3.1rem;text-align:center;background:var(--vi);padding:.1rem .4rem;border-radius:.3rem;font-size:1.4rem;line-height:1.3}
.cat{font-size:.75rem;border:1px solid var(--cy);color:var(--cy);border-radius:.3rem;padding:0 .35rem;font-weight:600}
.cat-lg{display:inline-block;font-size:1.3rem;border:1.5px solid var(--cy);color:var(--cy);border-radius:.3rem;padding:0 .6rem;line-height:1.35;font-style:italic;font-weight:800;margin-left:.5rem;vertical-align:middle}
.logo{height:5.2rem;width:5.2rem;max-width:100%;display:block;border-radius:50%;background:#fff;object-fit:contain}
.sp-top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:flex-end}
.sp-top img{height:auto;width:auto;max-height:32px;max-width:140px;object-fit:contain;display:block}
.sp-top a{display:inline-flex;align-items:center}
#sponsors{max-width:1600px;margin:2.5rem auto 0;padding:0 1rem}
#sponsors h2{text-align:center;text-transform:uppercase;font-size:1.1rem;margin:0 0 1rem;color:var(--mu)}
.sp-grp{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;margin-bottom:12px}
.sp-box{display:flex;align-items:center;justify-content:center;border-radius:.5rem;padding:8px}
.sp-box img{display:block;object-fit:contain;height:auto;width:auto}
.sp-box.l img{max-height:50px;max-width:180px}.sp-box.m img{max-height:38px;max-width:130px}.sp-box.s img{max-height:28px;max-width:90px}
.sp-box.empty{border:1px dashed #44444d;color:var(--mu);font-size:.85rem;text-align:center}
.sp-box.empty{background:rgba(255,255,255,.02);letter-spacing:.02em}.sp-box.empty.l{width:200px;height:56px}.sp-box.empty.m{width:150px;height:44px}.sp-box.empty.s{width:112px;height:34px;font-size:.72rem}
.sp-top .sp-box.empty{width:140px;height:40px;font-size:.8rem}
.sp-box.txt{color:#fff;font-weight:600;padding:0 1rem}
.pos1 .pos{color:var(--cy)}
th.c{text-align:center}
[hidden]{display:none!important}
/* Clasificacion final: tarjetas por categoria */
.fgrid{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:768px){.fgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1280px){.fgrid{grid-template-columns:repeat(3,1fr)}}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;overflow:hidden}
.fc-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.65rem 1rem;background:linear-gradient(100deg,#0c1a2e,#0d2a4d);border-bottom:2px solid var(--cy)}
.fc-st{font-size:.72rem;border:1px solid var(--cy);color:var(--cy);border-radius:.3rem;padding:.1rem .5rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.fc-st.prov{border-color:#ff9f43;color:#ff9f43}
.fc-r{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.75rem 1rem;border-top:1px solid var(--line)}
.fc-h + .fc-r{border-top:0}
.fc-e{padding:1rem;color:var(--mu);font-size:.9rem}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--cy);box-shadow:0 0 0 0 var(--cy);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 .6rem transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.slot{border:1px dashed #44444d;color:var(--mu);font-size:.75rem;padding:.35rem .9rem;border-radius:.4rem}
td,th{padding:.5rem .45rem}td{font-size:.95rem}.tot{font-size:1.2rem}
@media(max-width:1399px){td,th{padding:.45rem .35rem}td{font-size:.88rem}.stick{min-width:12.5rem}.tot{font-size:1.1rem}.num{min-width:2.6rem;font-size:1.2rem}.pos{font-size:1.6rem!important}}
@media(max-width:1199px){td,th{padding:.4rem .25rem}td{font-size:.8rem}th{font-size:.72rem}.stick{min-width:11rem}.tot{font-size:1rem}.cat{display:none}}
@media(max-width:767px){.tab{font-size:.85rem;padding:.5rem .75rem}.logo{height:4rem;width:4rem}.sp-top{justify-content:center}.sp-top img{max-width:104px}.sp-grp{gap:12px}}
</style>
</head>
<body>
<header class="hero">
  <div class="max-w-[1600px] mx-auto px-4 py-4 grid gap-4 items-center md:grid-cols-[auto_1fr_auto]">
    <div class="flex justify-center md:justify-start"><img class="logo" src="assets/logo-acrg.jpg" alt="Automóvil Club Río Grande" width="720" height="720"></div>
    <div class="text-center">
      <h1 id="evname" class="ttl text-xl md:text-3xl leading-tight m-0">SÚPER ESPECIAL</h1>
      <p id="evmeta" class="m-0 mt-2 text-lg" style="color:var(--cy)">Automóvil Club Río Grande · Modalidad Persecución</p>
    </div>
    <div id="sp-top" class="sp-top" aria-label="Sponsors oficiales"></div>
  </div>
</header>

<!-- Leyenda de Datos Extraoficiales -->
<div class="max-w-[1600px] mx-auto px-4 mt-4">
  <div style="background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 6px; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem; color: #fbbf24; font-family: Barlow, system-ui, sans-serif; font-size: 0.9rem; text-align: left;">
    <span style="font-size: 1.2rem; line-height: 1;">⚠️</span>
    <div>
      <strong style="text-transform: uppercase; letter-spacing: 0.02em;">Datos extraoficiales:</strong> La clasificación oficial la define la organización.
    </div>
  </div>
</div>

<main class="max-w-[1600px] mx-auto px-4 py-5">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
    <div role="tablist" class="tabs" aria-label="Vista">
      <button class="tab ttl" role="tab" data-v="gen" aria-selected="true">General</button>
      <button class="tab ttl" role="tab" data-v="cat" aria-selected="false">Por categoría</button>
      <button class="tab ttl" role="tab" data-v="e1" aria-selected="false">Etapa 1</button>
      <button class="tab ttl" role="tab" data-v="e2" aria-selected="false">Etapa 2</button>
      <button class="tab ttl" role="tab" data-v="fin" aria-selected="false">Clasificación Final</button>
      <button class="tab ttl" role="tab" data-v="pen" aria-selected="false">Penalizaciones</button>
      <button class="tab ttl" role="tab" data-v="insc" aria-selected="false">Inscriptos</button>
    </div>
    <button id="pdf" class="pdfbtn" type="button" title="Descargar esta vista en PDF">Descargar PDF</button>
    <div class="text-sm leading-tight text-right" aria-live="polite">
      <div class="flex items-center justify-end gap-2 font-semibold text-white"><span class="dot"></span><span>En vivo</span></div>
      <div class="mt-1" style="color:var(--mu)">Última actualización: <b id="upd" class="text-white">--:--:--</b></div>
    </div>
  </div>
  <div id="pebar" hidden aria-label="Resumen por PE"></div>
  <div id="chips" class="flex flex-wrap gap-3.5 mb-4" aria-label="Filtro por categoría"></div>
  <p id="note" class="text-sm mb-3" style="color:var(--mu)"></p>
  <div id="fin" class="fgrid" hidden></div>
  <div id="tw" class="overflow-x-auto rounded-lg" style="border:1px solid var(--line)"><table id="tbl"></table></div>
  <p id="foot" class="text-xs mt-3" style="color:var(--mu)">Solo se muestran tiempos netos de cada PE. Un DNF o abandono queda fuera del ordenamiento y no suma como tiempo.</p>
</main>

<section id="sponsors" aria-label="Sponsors"></section>

<script src="footer.js"></script>
<script type="module">
import { state, startLive, toRows, liveEvent, clock } from './03_public-live-timing.js';
import { rank, isN } from './ranking.js';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const f = x => { const h = Math.floor(x / 360000), m = Math.floor(x / 6000) % 60, s = Math.floor(x / 100) % 60, c = x % 100; const p = v => String(v).padStart(2, '0'); return (h ? h + ':' + p(m) : m) + ':' + p(s) + '.' + p(c) };
let view = 'gen', cat = 'all', PES = [], ROWS = [], CATS = [], CREWS = [];
let peSel = 0, prevView = 'gen';   // vista por PE: indice de la PE elegida y vista a la que se vuelve

function body(list, a, b) {
  const best = []; for (let i = a; i < b; i++) best[i] = Math.min(...list.map(x => x.c.t[i]).filter(isN));
  return list.map(x => { const c = x.c; return `<tr class="${x.pos === 1 ? 'pos1' : ''}" style="${x.part || x.pos === '-' ? 'opacity:.75' : ''}">
  <td class="stick"><div class="flex items-center gap-3"><span class="sp it pos ${isN(x.pos) ? 'text-3xl' : 'text-lg'} w-9 text-center">${x.pos}</span><span class="sp it num">${c.n}</span>
  <div class="leading-tight"><div class="font-semibold">${esc(c.p)} <span class="cat">${esc(c.cat)}</span></div><div class="text-sm" style="color:var(--mu)">${esc(c.nv)}${c.pe ? ' · ' + esc(c.pe) : ''}</div></div></div></td>
  ${c.t.slice(a, b).map((v, i) => v === 'DNF' ? '<td style="color:#ff6b81">DNF</td>' : v === undefined ? '<td style="color:#55555e">·</td>' : `<td class="${v === best[a + i] ? 'best' : ''}">${f(v)}${c.pen[a + i] ? '<span class="pn">+' + f(c.pen[a + i]) + '</span>' : ''}</td>`).join('')}
  <td class="sp it tot">${x.tot == null ? (x.dnf ? '<span style="color:#ff6b81">DNF</span>' : '--') : f(x.tot) + (x.part ? `<span class="text-xs block" style="color:var(--mu)">${x.done}/${x.K} PE</span>` : '')}</td>
  <td style="color:var(--mu)">${x.gap > 0 ? '+' + f(x.gap) : x.gap === 0 ? '-' : ''}</td></tr>` }).join('');
}

// Banderas: imagen de flagcdn.com por codigo de pais (ISO de 2 letras). Sin dato en la base = Argentina.
const flag = code => `<img class="flag" src="https://flagcdn.com/w40/${esc(String(code).toLowerCase())}.png" alt="${esc(String(code).toUpperCase())}" title="${esc(String(code).toUpperCase())}" loading="lazy" width="28" height="19" onerror="this.replaceWith(document.createTextNode(this.alt))">`;
// Marca del auto = primera palabra del modelo ("Ford Fiesta" -> ford). El logo se busca en assets/brands/<marca>.png; si no esta el archivo, no se muestra.
const BRAND_ALIAS = { volkswagen: 'vw', 'škoda': 'skoda', citroën: 'citroen', mercedes: 'mercedes', 'mercedes-benz': 'mercedes' };
const brand = m => { const w = String(m || '').trim().split(/\s+/)[0].toLowerCase().normalize('NFC'); return BRAND_ALIAS[w] || w.normalize('NFD').replace(/[^a-z0-9]/g, '') };
function vehiculo(m) {
  if (!m) return '<span style="color:#55555e">·</span>';
  const b = brand(m);
  return `<span class="veh">${b ? `<img src="assets/brands/${esc(b)}.png" alt="" onerror="this.remove()">` : ''}<span>${esc(m)}</span></span>`;
}
function inscriptos() {
  const list = CREWS.filter(c => cat === 'all' || c.category === cat).sort((p, q) => p.car_number - q.car_number);
  $('#note').textContent = `${list.length} ${list.length === 1 ? 'tripulación inscripta' : 'tripulaciones inscriptas'}${cat === 'all' ? '' : ' en la categoría ' + cat}.`;
  if (!list.length) { $('#tbl').innerHTML = '<tbody><tr><td>Todavía no hay tripulaciones cargadas para este evento.</td></tr></tbody>'; return }
  $('#tbl').innerHTML = `<thead><tr><th>Nro.</th><th>Nacionalidad</th><th>Piloto</th><th>Navegante</th><th>Piloto Inv.</th><th>Vehículo</th><th>Categoría</th><th>Peña</th></tr></thead><tbody>${list.map(c => `<tr>
    <td><span class="sp it num">${esc(c.car_number)}</span></td>
    <td>${flag(c.nationality || 'ar')}${c.co_driver ? flag(c.co_nationality || c.nationality || 'ar') : ''}</td>
    <td class="font-semibold">${esc(c.driver)}</td><td>${esc(c.co_driver)}</td><td>${esc(c.inv_driver)}</td>
    <td>${vehiculo(c.car_model)}</td>
    <td><span class="cat" style="display:inline-block;font-size:.9rem;font-style:italic;font-weight:800">${esc(c.category)}</span></td>
    <td style="color:var(--mu)">${esc(c.team)}</td></tr>`).join('')}</tbody>`;
}

// Clasificacion final: podio (top 3) por categoria. "Finalizado" cuando todas las tripulaciones de la categoria terminaron o abandonaron.
function final() {
  const n = PES.length, ks = CATS.filter(k => cat === 'all' || k === cat), car = new Map(CREWS.map(c => [c.car_number, c]));
  $('#note').textContent = 'Top 3 de cada categoría con los tiempos validados. Mientras haya tripulaciones en carrera, el podio es provisorio.';
  if (!ks.length) { $('#fin').innerHTML = '<p class="fc-e">Todavía no hay tiempos validados para este evento.</p>'; return }
  $('#fin').innerHTML = ks.map(k => {
    const rows = ROWS.filter(c => c.cat === k);
    const top = rank(rows, 0, n).filter(x => isN(x.pos)).slice(0, 3);
    const closed = n > 0 && rows.every(c => c.t.includes('DNF') || c.t.every(isN));
    const list = top.map(x => {
      const c = x.c, veh = car.get(c.n)?.car_model || c.pe || '';
      const right = x.pos === 1 ? `<span class="sp it" style="font-size:1.5rem;color:var(--cy)">${f(x.tot)}</span>`
        : x.part ? `<span class="text-sm" style="color:var(--mu)">${x.done}/${x.K} PE</span>`
        : `<span class="sp it" style="font-size:1.3rem;color:var(--mu)">+${f(x.gap)}</span>`;
      return `<div class="fc-r"><span class="sp it num">${x.pos}</span>
        <div class="leading-tight min-w-0"><div class="font-semibold">${esc(c.p)}</div><div class="text-sm" style="color:var(--mu)">${esc(c.nv)}</div>
        <div class="text-xs mt-1" style="color:var(--mu)">#${esc(c.n)}${veh ? ' · ' + esc(veh) : ''}</div></div>${right}</div>`;
    }).join('') || '<p class="fc-e">Sin tiempos validados todavía.</p>';
    return `<article class="fc"><div class="fc-h"><h3 class="ttl text-lg m-0">${esc(k)}</h3><span class="fc-st ${closed ? '' : 'prov'}">${closed ? 'Finalizado' : 'Provisorio'}</span></div>${list}</article>`;
  }).join('');
}

// Penalizaciones: salen de la tabla publica "results" (penalty_cs > 0 y su motivo). Formato +HH:MM:SS.
const pf = x => { const p = v => String(v).padStart(2, '0'); return '+' + p(Math.floor(x / 360000)) + ':' + p(Math.floor(x / 6000) % 60) + ':' + p(Math.floor(x / 100) % 60) + (x % 100 ? ',' + p(x % 100) : '') };
function penList() {
  const pe = new Map(PES.map(p => [p.id, p])), car = new Map(CREWS.map(c => [c.id, c]));
  return [...state.results.values()]
    .filter(r => r.penalty_cs > 0 && car.has(r.crew_id) && (cat === 'all' || car.get(r.crew_id).category === cat))
    .map(r => ({ r, c: car.get(r.crew_id), pe: pe.get(r.special_stage_id) }))
    .sort((x, y) => x.c.car_number - y.c.car_number || (x.pe?.number ?? 0) - (y.pe?.number ?? 0));
}
function penalizaciones() {
  const list = penList();
  $('#note').textContent = list.length ? `${list.length} ${list.length === 1 ? 'penalización aplicada' : 'penalizaciones aplicadas'}${cat === 'all' ? '' : ' en la categoría ' + cat}. Se suman al tiempo de la PE.` : 'Todavía no hay penalizaciones registradas.';
  if (!list.length) { $('#tbl').innerHTML = ''; return }
  $('#tbl').innerHTML = `<thead><tr><th>Nro.</th><th>Vehículo</th><th>Nacionalidad</th><th>Piloto</th><th>Navegante</th><th>Categoría</th><th>PE</th><th>Penalización</th><th>Motivo</th></tr></thead><tbody>${list.map(({ r, c, pe }) => `<tr>
    <td><span class="sp it num">${esc(c.car_number)}</span></td><td>${vehiculo(c.car_model)}</td>
    <td>${flag(c.nationality || 'ar')}${c.co_driver ? flag(c.co_nationality || c.nationality || 'ar') : ''}</td>
    <td class="font-semibold">${esc(c.driver)}</td><td>${esc(c.co_driver)}</td>
    <td><span class="cat" style="display:inline-block;font-size:.9rem;font-style:italic;font-weight:800">${esc(c.category)}</span></td>
    <td>${esc(pe?.name || '')}</td><td style="color:#ff6b81;font-weight:700">${pf(r.penalty_cs)}</td><td>${esc(r.penalty_reason || '—')}</td></tr>`).join('')}</tbody>`;
}

// ---- Resumen por PE: todos los tiempos de una PE, ordenados, con diferencia contra el 1º y contra el anterior ----
function peList() {
  const rows = ROWS.filter(c => cat === 'all' || c.cat === cat), i = peSel;
  const ok = rows.filter(c => typeof c.t[i] === 'number').sort((x, y) => x.t[i] - y.t[i] || x.n - y.n);
  const ranked = ok.map((c, k) => ({ c, v: c.t[i], pen: c.pen[i] || 0, pos: ok.findIndex(y => y.t[i] === c.t[i]) + 1,
    gapL: c.t[i] - ok[0].t[i], gapP: k ? c.t[i] - ok[k - 1].t[i] : 0 }));
  const dnf = rows.filter(c => c.t[i] === 'DNF');
  return { ranked, dnf, pending: rows.length - ok.length - dnf.length };
}
function peView() {
  const p = PES[peSel];
  $('#pebar').innerHTML = '<button class="pebtn back" type="button" data-back>← Volver</button>' + PES.map((q, k) => `<button class="pebtn" type="button" data-peb="${k}" aria-pressed="${k === peSel}">${esc(q.name)}</button>`).join('');
  if (!p) { $('#tbl').innerHTML = ''; $('#note').textContent = 'Esa PE todavía no existe.'; return }
  const { ranked, dnf, pending } = peList();
  $('#note').textContent = `${p.name}${p.stages?.number ? ' · Etapa ' + p.stages.number : ''}: ${ranked.length} con tiempo${dnf.length ? ', ' + dnf.length + ' DNF' : ''}${pending ? ', faltan ' + pending : ''}. ` +
    (cat === 'all' ? 'Posiciones de toda la PE.' : 'Posiciones dentro de la categoría ' + cat + '.') + ' Diferencia contra el 1º y contra el auto anterior.';
  if (!ranked.length && !dnf.length) { $('#tbl').innerHTML = '<tbody><tr><td style="text-align:left">Todavía no hay tiempos en esta PE.</td></tr></tbody>'; return }
  const who = (pos, c, dim) => `<tr class="${pos === 1 ? 'pos1' : ''}" style="${dim ? 'opacity:.75' : ''}"><td class="stick"><div class="flex items-center gap-3"><span class="sp it pos ${typeof pos === 'number' ? 'text-3xl' : 'text-lg'} w-9 text-center">${pos}</span><span class="sp it num">${esc(c.n)}</span>
    <div class="leading-tight"><div class="font-semibold">${esc(c.p)} <span class="cat">${esc(c.cat)}</span></div><div class="text-sm" style="color:var(--mu)">${esc(c.nv)}${c.pe ? ' · ' + esc(c.pe) : ''}</div></div></div></td>`;
  $('#tbl').innerHTML = `<thead><tr><th class="stick">Pos / Auto / Tripulación</th><th>Tiempo ${esc(p.name)}</th><th>Dif. 1º</th><th>Dif. anterior</th></tr></thead><tbody>` +
    ranked.map(x => who(x.pos, x.c, false) + `<td class="sp it tot ${x.pos === 1 ? 'best' : ''}">${f(x.v)}${x.pen ? '<span class="pn">+' + f(x.pen) + '</span>' : ''}</td><td style="color:var(--mu)">${x.pos === 1 ? '-' : '+' + f(x.gapL)}</td><td style="color:var(--mu)">${x.pos === 1 ? '-' : '+' + f(x.gapP)}</td></tr>`).join('') +
    dnf.map(c => who('-', c, true) + '<td style="color:#ff6b81">DNF</td><td></td><td></td></tr>').join('') + '</tbody>';
}
function openPE(k) {
  if (view !== 'pe') prevView = view;
  view = 'pe'; peSel = k;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', 'false'));
  render();
}
$('#tbl').addEventListener('click', e => { const h = e.target.closest('th[data-pe]'); if (h) openPE(+h.dataset.pe) });
$('#tbl').addEventListener('keydown', e => { const h = e.target.closest?.('th[data-pe]'); if (h && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPE(+h.dataset.pe) } });
$('#pebar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.back !== undefined) { view = prevView || 'gen'; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.dataset.v === view)); render() }
  else if (b.dataset.peb !== undefined) { peSel = +b.dataset.peb; render() }
});

function render() {
  const fin = view === 'fin';
  $('#pdf').hidden = view === 'insc';
  $('#pebar').hidden = view !== 'pe';
  $('#foot').hidden = view === 'insc' || fin || view === 'pen';
  $('#tw').hidden = fin; $('#fin').hidden = !fin;
  if (fin) { final(); return }
  if (view === 'insc') { inscriptos(); return }
  if (view === 'pen') { penalizaciones(); return }
  if (view === 'pe') { peView(); return }
  if (!ROWS.length) { $('#tbl').innerHTML = '<tbody><tr><td style="text-align:left">Todavía no hay tripulaciones cargadas para este evento.</td></tr></tbody>'; return }
  const n = PES.length, s2 = PES.findIndex(p => p.stages?.number === 2);
  const [a, b] = view === 'e2' && s2 >= 0 ? [s2, n] : view === 'e1' ? [0, s2 > 0 ? s2 : n] : [0, n];
  const rows = ROWS.filter(c => cat === 'all' || c.cat === cat);
  const lastCol = view === 'e1' ? 'Etapa 1' : view === 'e2' ? 'Etapa 2' : 'Acumulado';
  let html = `<thead><tr><th class="stick">Pos / Auto / Tripulación</th>${PES.slice(a, b).map((p, k) => `<th class="c pe-h" data-pe="${a + k}" tabindex="0" role="button" title="Ver el resumen de ${esc(p.name)}">${esc(p.name)}</th>`).join('')}<th>${lastCol}</th><th>Diferencia</th></tr></thead>`;
  const cols = b - a + 3;
  if (view === 'cat') CATS.filter(k => cat === 'all' || k === cat).forEach(k => {
    html += `<tbody><tr><td colspan="${cols}" class="ttl text-lg" style="background:#0c1a2e;text-align:left;border-left:4px solid var(--vi)">Categoría <span class="cat-lg">${esc(k)}</span></td></tr>${body(rank(rows.filter(c => c.cat === k), a, b), a, b)}</tbody>`;
  }); else html += `<tbody>${body(rank(rows, a, b), a, b)}</tbody>`;
  $('#tbl').innerHTML = html;
  $('#note').textContent = view === 'e2' && s2 < 0 ? 'Esta fecha todavía no tiene Etapa 2 cargada.' :
    view === 'e1' && s2 === 0 ? 'Esta fecha todavía no tiene Etapa 1 cargada.' :
    { gen: `Acumulado de las PE corridas hasta ahora (PE${a + 1} a PE${b}). Quien tiene menos PE completadas va debajo, atenuado.`,
      cat: 'Posiciones dentro de cada categoría. La diferencia es contra el líder de la categoría.',
      e1: 'Etapa 1 independiente: suma solo de sus PE.',
      e2: 'Etapa 2 independiente: suma solo de sus PE.' }[view] + ' Tocá el nombre de una PE para ver su resumen.';
}
function chips() {
  $('#chips').innerHTML = ['all', ...CATS].map(k => `<button class="chip text-lg" data-c="${esc(k)}" aria-pressed="${k === cat}">${k === 'all' ? 'TODAS' : esc(k)}</button>`).join('');
}
$('#chips').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; chips(); render() };
document.querySelector('[role=tablist]').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; view = b.dataset.v; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b)); render() };

// ---- Descargar PDF de la vista actual (respeta pestaña y filtro de categoría) ----
const PDF_NOTA = 'Tiempos netos. Resultados provisorios hasta su confirmación oficial por la organización.';
const loadJs = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('No se pudo cargar la librería de PDF (¿sin conexión?)')); document.head.appendChild(s) });
const toDataUrl = async url => { const b = await (await fetch(url)).blob(); return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b) }) };
const VIEW_TITLE = { gen: 'Clasificación general (acumulado)', cat: 'Clasificación por categoría', e1: 'Etapa 1', e2: 'Etapa 2', fin: 'Clasificación final: podio por categoría', pen: 'Penalizaciones', pe: 'Resumen por PE' };

function buildPdf(doc, logo) {
  const n = PES.length, s2 = PES.findIndex(p => p.stages?.number === 2);
  const [a, b] = view === 'e2' && s2 >= 0 ? [s2, n] : view === 'e1' ? [0, s2 > 0 ? s2 : n] : [0, n];
  const lastCol = view === 'e1' ? 'Etapa 1' : view === 'e2' ? 'Etapa 2' : 'Acumulado';
  const rows = ROWS.filter(c => cat === 'all' || c.cat === cat);
  const ks = CATS.filter(k => cat === 'all' || k === cat);
  const car = new Map(CREWS.map(c => [c.car_number, c]));
  const when = new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Ushuaia', hourCycle: 'h23', dateStyle: 'short', timeStyle: 'short' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const cell = (x, i) => { const v = x.c.t[i], pn = x.c.pen[i]; return v === 'DNF' ? 'DNF' : v === undefined ? '-' : f(v) + (pn ? ' (+' + f(pn) + ')' : '') };
  const tot = x => x.tot == null ? (x.dnf ? 'DNF' : '--') : f(x.tot) + (x.part ? ` (${x.done}/${x.K} PE)` : '');
  const gap = x => x.gap > 0 ? '+' + f(x.gap) : x.gap === 0 ? '-' : '';
  const pes = PES.slice(a, b);
  const headPE = [['Pos', 'Nº', 'Piloto', 'Navegante', 'Cat.', ...pes.map(p => p.name), lastCol, 'Dif.']];
  const bodyPE = list => rank(list, a, b).map(x => [x.pos, x.c.n, x.c.p, x.c.nv || '', x.c.cat, ...pes.map((_, k) => cell(x, a + k)), tot(x), gap(x)]);
  const headFin = [['Pos', 'Nº', 'Piloto', 'Navegante', 'Vehículo', 'Tiempo', 'Dif.']];
  const bodyFin = list => rank(list, 0, n).filter(x => isN(x.pos)).slice(0, 3)
    .map(x => [x.pos, x.c.n, x.c.p, x.c.nv || '', car.get(x.c.n)?.car_model || '', tot(x), gap(x)]);

  const pageHead = () => {
    if (logo) doc.addImage(logo, 'JPEG', 10, 6, 20, 20);
    doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.text(BRAND.title, 34, 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(70);
    doc.text([BRAND.subtitle, EVFECHAS].filter(Boolean).join('  ·  '), 34, 19.5);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(20); doc.text((view === 'pe' ? (PES[peSel]?.name || 'PE') + ' · resumen' : VIEW_TITLE[view]) + (cat === 'all' ? '' : ' · Categoría ' + cat), 34, 25);
    doc.setDrawColor(110, 199, 255); doc.setLineWidth(0.8); doc.line(10, 29, W - 10, 29);
  };
  const common = { theme: 'grid', margin: { top: 33, left: 10, right: 10, bottom: 14 }, styles: { fontSize: 8.5, cellPadding: 1.6, valign: 'middle', lineColor: [200, 200, 205] },
    headStyles: { fillColor: [13, 42, 77], textColor: 255, halign: 'center' }, alternateRowStyles: { fillColor: [244, 248, 252] }, didDrawPage: pageHead,
    didParseCell: d => { if (d.section === 'body' && String(d.row.raw[0]) === '1') d.cell.styles.fontStyle = 'bold' } };
  const alignPE = { 0: { halign: 'center', cellWidth: 11 }, 1: { halign: 'center', cellWidth: 11 }, 4: { halign: 'center', cellWidth: 14 } };
  for (let i = 5; i < 5 + pes.length + 2; i++) alignPE[i] = { halign: 'center' };
  const alignFin = { 0: { halign: 'center', cellWidth: 11 }, 1: { halign: 'center', cellWidth: 11 }, 5: { halign: 'center' }, 6: { halign: 'center' } };

  const section = (title, head, body, cols) => {
    const y = doc.lastAutoTable ? doc.lastAutoTable.finalY + 8 : 33;
    if (title) { if (y > H - 40) { doc.addPage(); } const yy = y > H - 40 ? 33 : y; doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(13, 42, 77); doc.text(title, 10, yy + 1); doc.autoTable({ ...common, head, body, columnStyles: cols, startY: yy + 4 }) }
    else doc.autoTable({ ...common, head, body, columnStyles: cols, startY: y });
  };

  if (view === 'pen') {
    const l = penList();
    if (!l.length) { pageHead(); doc.setFontSize(11); doc.setTextColor(60); doc.text('Todavía no hay penalizaciones registradas.', 10, 40) }
    else section(null, [['Nº', 'Piloto', 'Navegante', 'Cat.', 'PE', 'Penalización', 'Motivo']],
      l.map(({ r, c, pe }) => [c.car_number, c.driver, c.co_driver || '', c.category, pe?.name || '', pf(r.penalty_cs), r.penalty_reason || '-']),
      { 0: { halign: 'center', cellWidth: 12 }, 3: { halign: 'center', cellWidth: 16 }, 4: { halign: 'center', cellWidth: 16 }, 5: { halign: 'center', cellWidth: 28 } });
  }
  else if (view === 'pe') {
    const { ranked, dnf } = peList();
    if (!ranked.length && !dnf.length) { pageHead(); doc.setFontSize(11); doc.setTextColor(60); doc.text('Todavía no hay tiempos en esta PE.', 10, 40) }
    else section(null, [['Pos', 'Nº', 'Piloto', 'Navegante', 'Cat.', 'Tiempo', 'Dif. 1º', 'Dif. anterior']],
      [...ranked.map(x => [x.pos, x.c.n, x.c.p, x.c.nv || '', x.c.cat, f(x.v) + (x.pen ? ' (+' + f(x.pen) + ')' : ''), x.pos === 1 ? '-' : '+' + f(x.gapL), x.pos === 1 ? '-' : '+' + f(x.gapP)]),
       ...dnf.map(c => ['-', c.n, c.p, c.co_driver || c.nv || '', c.cat, 'DNF', '', ''])],
      { 0: { halign: 'center', cellWidth: 11 }, 1: { halign: 'center', cellWidth: 11 }, 4: { halign: 'center', cellWidth: 14 }, 5: { halign: 'center' }, 6: { halign: 'center' }, 7: { halign: 'center' } });
  }
  else if (!ROWS.length || (view === 'fin' && !ks.length)) { pageHead(); doc.setFontSize(11); doc.setTextColor(60); doc.text('Todavía no hay datos cargados para este evento.', 10, 40) }
  else if (view === 'fin') ks.forEach(k => section('Categoría ' + k, headFin, bodyFin(ROWS.filter(c => c.cat === k)) , alignFin));
  else if (view === 'cat') ks.forEach(k => section('Categoría ' + k, headPE, bodyPE(rows.filter(c => c.cat === k)), alignPE));
  else section(null, headPE, bodyPE(rows), alignPE);

  const pages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(110);
    doc.text(PDF_NOTA, 10, H - 7); doc.text(`Generado el ${when} (hora Tierra del Fuego) · Página ${p} de ${pages}`, W - 10, H - 7, { align: 'right' });
  }
}
async function pdf() {
  const btn = $('#pdf'), txt = btn.textContent; btn.disabled = true; btn.textContent = 'Generando…';
  try {
    if (!window.jspdf) {
      await loadJs('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
      await loadJs('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
    }
    const logo = await toDataUrl('assets/logo-acrg.jpg').catch(() => null);
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    buildPdf(doc, logo);
    doc.save(`super-especial-acrg_${view === 'pe' ? PES[peSel].name : view}${cat === 'all' ? '' : '_' + cat}_${new Date().toISOString().slice(0, 10)}.pdf`);
  } catch (e) { alert('No se pudo generar el PDF: ' + e.message) }
  finally { btn.disabled = false; btn.textContent = txt }
}
$('#pdf').onclick = pdf;

function onData(st) {
  PES = st.stages; ROWS = toRows(st); CREWS = [...st.crews.values()];
  const cs = [...new Set(ROWS.map(r => r.cat))].sort();
  if (cs.join() !== CATS.join()) { CATS = cs; chips() }
  $('#upd').textContent = clock(st.last);   // hora del ultimo dato validado, no del reloj del equipo
  render();
}
// Encabezado desde la base: nombre, sede y fechas del evento ('YYYY-MM-DD', sin conversion de zona horaria).
const BRAND = { title: 'SÚPER ESPECIAL', subtitle: 'Automóvil Club Río Grande · Modalidad Persecución' };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechas(a, b) {
  if (!a) return '';
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = (b || a).split('-').map(Number);
  if (a === (b || a)) return `${d1} de ${MESES[m1 - 1]}`;
  if (m1 === m2 && y1 === y2) return `${d1} y ${d2} de ${MESES[m1 - 1]}`;
  return `${d1} de ${MESES[m1 - 1]} al ${d2} de ${MESES[m2 - 1]}`;
}
let EVFECHAS = '';
function header(ev) {
  EVFECHAS = fechas(ev.starts_on, ev.ends_on);
  $('#evmeta').textContent = [BRAND.subtitle, fechas(ev.starts_on, ev.ends_on)].filter(Boolean).join(' · ');
  $('#evname').textContent = BRAND.title;
  document.title = `${BRAND.title} - Live Timing`;
}
// Sponsors: espacios genericos disponibles (sin sponsors.js). Cantidad por zona editable aca.
const SLOTS = { top: 4, l: 2, m: 3, s: 4 };
function sponsors() {
  const box = (k, t) => `<span class="sp-box empty ${k}">${t}</span>`;
  $('#sp-top').innerHTML = Array.from({ length: SLOTS.top }, () => box('t', 'Tu Sponsor Aquí')).join('');
  const groups = ['l', 'm', 's'].map(k => `<div class="sp-grp">${Array.from({ length: SLOTS[k] }, () => box(k, 'Espacio Disponible')).join('')}</div>`).join('');
  $('#sponsors').innerHTML = `<h2 class="ttl">Sponsors</h2>${groups}`;
}
sponsors();
chips();
try {
  const ev = await liveEvent();
  if (ev) { header(ev); startLive(ev.id, onData) } else { $('#evname').textContent = 'Sin evento en vivo'; $('#note').textContent = 'No hay un evento en vivo en este momento.' }
} catch (e) { console.error(e); $('#note').textContent = 'No pudimos conectar con el servidor. Reintentá en unos segundos.' }
</script>
</body>
</html>
