<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Fueguino - Live Timing</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0B0B0B;--panel:#141417;--line:#2a2a31;--cy:#00E5D9;--vi:#8A2BE2;--tx:#fff;--mu:#b4b4bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;margin:0}
.sp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;letter-spacing:.01em}
.hero{background:linear-gradient(100deg,#0B0B0B 30%,#2a0f4a 100%);border-bottom:3px solid var(--cy)}
.chip{border:1px solid var(--line);color:var(--mu);padding:.35rem .8rem;border-radius:999px;font-weight:600;cursor:pointer;background:transparent}
.chip[aria-pressed=true]{background:var(--cy);color:#001514;border-color:var(--cy)}
.tab{padding:.7rem 1.1rem;font-size:1.25rem;color:var(--mu);border-bottom:4px solid transparent;background:none;cursor:pointer}
.tab[aria-selected=true]{color:#fff;border-color:var(--vi)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{font-weight:600;font-size:.8rem;color:var(--mu);text-align:right;white-space:nowrap;background:#101013;position:sticky;top:0}
td{text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stick{position:sticky;left:0;text-align:left;background:var(--bg);z-index:2;min-width:14rem}
th.stick{background:#101013;z-index:3}
tr:hover td{background:#17171b} tr:hover td.stick{background:#17171b}
.best{color:var(--cy);font-weight:600}
.num{display:inline-block;min-width:3.1rem;text-align:center;background:var(--vi);padding:.1rem .4rem;border-radius:.3rem;font-size:1.4rem;line-height:1.3}
.cat{font-size:.75rem;border:1px solid var(--cy);color:var(--cy);border-radius:.3rem;padding:0 .35rem;font-weight:600}
.pos1 .pos{color:var(--cy)}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--cy);box-shadow:0 0 0 0 var(--cy);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 .6rem transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.slot{border:1px dashed #44444d;color:var(--mu);font-size:.75rem;padding:.35rem .9rem;border-radius:.4rem}
td,th{padding:.5rem .45rem}td{font-size:.95rem}.tot{font-size:1.2rem}
@media(max-width:1399px){td,th{padding:.45rem .35rem}td{font-size:.88rem}.stick{min-width:12.5rem}.tot{font-size:1.1rem}.num{min-width:2.6rem;font-size:1.2rem}.pos{font-size:1.6rem!important}}
@media(max-width:1199px){td,th{padding:.4rem .25rem}td{font-size:.8rem}th{font-size:.72rem}.stick{min-width:11rem}.tot{font-size:1rem}.cat{display:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="max-w-[1600px] mx-auto px-4 py-5 flex flex-wrap items-center gap-4 justify-between">
    <div class="flex items-center gap-4">
      <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Logo Rally Fueguino"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#00E5D9"/><stop offset="1" stop-color="#8A2BE2"/></linearGradient></defs><path d="M8 52 32 6l24 46-24-10z" fill="url(#g)"/><path d="M32 18l11 21-11-5-11 5z" fill="#0B0B0B"/></svg>
      <div>
        <h1 class="sp text-4xl md:text-5xl uppercase leading-none m-0">Rally Fueguino</h1>
        <p id="evmeta" class="m-0 mt-1" style="color:var(--cy)">A.PI.TU.R.</p>
        <p id="evname" class="m-0 text-sm" style="color:var(--mu)">Cargando evento…</p>
      </div>
    </div>
    <div class="flex flex-wrap gap-2" aria-label="Sponsors oficiales">
      <span class="slot">YPF Autosur</span><span class="slot">BGH</span><span class="slot">RGA</span><span class="slot">Tolhuin</span>
    </div>
  </div>
</header>

<main class="max-w-[1600px] mx-auto px-4 py-5">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
    <div role="tablist" class="flex sp uppercase" aria-label="Vista">
      <button class="tab sp" role="tab" data-v="gen" aria-selected="true">General</button>
      <button class="tab sp" role="tab" data-v="cat" aria-selected="false">Por categoría</button>
      <button class="tab sp" role="tab" data-v="e2" aria-selected="false">Etapa 2</button>
    </div>
    <div class="flex items-center gap-2 text-sm" style="color:var(--mu)" aria-live="polite">
      <span class="dot"></span><span>En vivo · actualizado <b id="upd" class="text-white">--:--:--</b></span>
    </div>
  </div>
  <div id="chips" class="flex flex-wrap gap-2 mb-4" aria-label="Filtro por categoría"></div>
  <p id="note" class="text-sm mb-3" style="color:var(--mu)"></p>
  <div class="overflow-x-auto rounded-lg" style="border:1px solid var(--line)"><table id="tbl"></table></div>
  <p class="text-xs mt-3" style="color:var(--mu)">Solo se muestran tiempos netos de cada PE. Un DNF o abandono queda fuera del ordenamiento y no suma como tiempo.</p>
</main>

<script src="footer.js"></script>
<script type="module">
import { state, startLive, toRows, liveEvent } from './03_public-live-timing.js';
import { rank, isN } from './ranking.js';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const f = x => { const h = Math.floor(x / 360000), m = Math.floor(x / 6000) % 60, s = Math.floor(x / 100) % 60, c = x % 100; const p = v => String(v).padStart(2, '0'); return (h ? h + ':' + p(m) : m) + ':' + p(s) + '.' + p(c) };
let view = 'gen', cat = 'all', PES = [], ROWS = [], CATS = [];

function body(list, a, b) {
  const best = []; for (let i = a; i < b; i++) best[i] = Math.min(...list.map(x => x.c.t[i]).filter(isN));
  return list.map(x => { const c = x.c; return `<tr class="${x.pos === 1 ? 'pos1' : ''}" style="${x.part || x.pos === '-' ? 'opacity:.75' : ''}">
  <td class="stick"><div class="flex items-center gap-3"><span class="sp pos ${isN(x.pos) ? 'text-3xl' : 'text-lg'} w-9 text-center">${x.pos}</span><span class="sp num">${c.n}</span>
  <div class="leading-tight"><div class="font-semibold">${esc(c.p)} <span class="cat">${esc(c.cat)}</span></div><div class="text-sm" style="color:var(--mu)">${esc(c.nv)}${c.pe ? ' · ' + esc(c.pe) : ''}</div></div></div></td>
  ${c.t.slice(a, b).map((v, i) => v === 'DNF' ? '<td style="color:#ff6b81">DNF</td>' : v === undefined ? '<td style="color:#55555e">·</td>' : `<td class="${v === best[a + i] ? 'best' : ''}">${f(v)}${c.pen[a + i] ? '<sup style="color:#ff9f43"> +' + f(c.pen[a + i]) + '</sup>' : ''}</td>`).join('')}
  <td class="sp tot">${x.tot == null ? (x.dnf ? '<span style="color:#ff6b81">DNF</span>' : '--') : f(x.tot) + (x.part ? `<sub class="text-xs" style="color:var(--mu)"> ${x.done}/${x.K} PE</sub>` : '')}</td>
  <td style="color:var(--mu)">${x.gap > 0 ? '+' + f(x.gap) : x.gap === 0 ? '-' : ''}</td></tr>` }).join('');
}

function render() {
  if (!ROWS.length) { $('#tbl').innerHTML = '<tbody><tr><td style="text-align:left">Todavía no hay tripulaciones cargadas para este evento.</td></tr></tbody>'; return }
  const n = PES.length, s2 = PES.findIndex(p => p.stages?.number === 2);
  const [a, b] = view === 'e2' && s2 >= 0 ? [s2, n] : [0, n];
  const rows = ROWS.filter(c => cat === 'all' || c.cat === cat);
  let html = `<thead><tr><th class="stick">Pos / Auto / Tripulación</th>${PES.slice(a, b).map(p => `<th>${esc(p.name)}</th>`).join('')}<th>${view === 'e2' ? 'Etapa 2' : 'Acumulado'}</th><th>Diferencia</th></tr></thead>`;
  const cols = b - a + 3;
  if (view === 'cat') CATS.filter(k => cat === 'all' || k === cat).forEach(k => {
    html += `<tbody><tr><td colspan="${cols}" class="sp text-2xl" style="background:#1b1030;text-align:left;border-left:4px solid var(--vi)">Categoría ${esc(k)}</td></tr>${body(rank(rows.filter(c => c.cat === k), a, b), a, b)}</tbody>`;
  }); else html += `<tbody>${body(rank(rows, a, b), a, b)}</tbody>`;
  $('#tbl').innerHTML = html;
  $('#note').textContent = view === 'e2' && s2 < 0 ? 'Esta fecha todavía no tiene Etapa 2 cargada.' :
    { gen: `Acumulado de las PE corridas hasta ahora (PE${a + 1} a PE${b}). Quien tiene menos PE completadas va debajo, atenuado.`,
      cat: 'Posiciones dentro de cada categoría. La diferencia es contra el líder de la categoría.',
      e2: 'Etapa 2 independiente: suma solo de sus PE.' }[view];
}
function chips() {
  $('#chips').innerHTML = ['all', ...CATS].map(k => `<button class="chip sp text-lg" data-c="${esc(k)}" aria-pressed="${k === cat}">${k === 'all' ? 'Todas' : esc(k)}</button>`).join('');
}
$('#chips').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; chips(); render() };
document.querySelector('[role=tablist]').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; view = b.dataset.v; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b)); render() };

function onData(st) {
  PES = st.stages; ROWS = toRows(st);
  const cs = [...new Set(ROWS.map(r => r.cat))].sort();
  if (cs.join() !== CATS.join()) { CATS = cs; chips() }
  $('#upd').textContent = new Date().toLocaleTimeString('es-AR', { hour12: false });
  render();
}
// Encabezado desde la base: nombre, sede y fechas del evento ('YYYY-MM-DD', sin conversion de zona horaria).
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechas(a, b) {
  if (!a) return '';
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = (b || a).split('-').map(Number);
  if (a === (b || a)) return `${d1} de ${MESES[m1 - 1]}`;
  if (m1 === m2 && y1 === y2) return `${d1} y ${d2} de ${MESES[m1 - 1]}`;
  return `${d1} de ${MESES[m1 - 1]} al ${d2} de ${MESES[m2 - 1]}`;
}
function header(ev) {
  $('#evmeta').textContent = ['A.PI.TU.R.', ev.venue, fechas(ev.starts_on, ev.ends_on)].filter(Boolean).join(' · ');
  $('#evname').textContent = ev.name;
  document.title = `${ev.name} - Rally Fueguino Live Timing`;
}
chips();
try {
  const ev = await liveEvent();
  if (ev) { header(ev); startLive(ev.id, onData) } else { $('#evname').textContent = 'Sin evento en vivo'; $('#note').textContent = 'No hay un evento en vivo en este momento.' }
} catch (e) { console.error(e); $('#note').textContent = 'No pudimos conectar con el servidor. Reintentá en unos segundos.' }
</script>
</body>
</html>
