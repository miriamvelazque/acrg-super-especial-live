<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Fueguino - Live Timing</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0B0B0B;--panel:#141417;--line:#2a2a31;--cy:#00E5D9;--vi:#8A2BE2;--tx:#fff;--mu:#b4b4bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;margin:0}
.sp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:normal;font-weight:800;letter-spacing:.01em}
.it{font-style:italic}
.ttl{font-family:Orbitron,'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.hero{background:linear-gradient(100deg,#0B0B0B 30%,#2a0f4a 100%);border-bottom:3px solid var(--cy)}
/* Filtro de categoria: mismo estilo que la etiqueta junto al nombre, pero invertido. Sin elegir = relleno con letra negra; elegido = solo borde. */
.chip{font-family:'Barlow Condensed','Arial Narrow',sans-serif;background:var(--cy);color:#001514;border:1.5px solid var(--cy);padding:.15rem .8rem;border-radius:.3rem;font-weight:800;font-style:italic;cursor:pointer;line-height:1.35}
.chip[aria-pressed=true]{background:transparent;color:var(--cy);box-shadow:0 0 0 3px rgba(0,229,217,.28)}
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:.6rem 1.1rem;font-size:1.05rem;line-height:1.2;color:var(--mu);border-bottom:5px solid transparent;background:none;cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;border-color:var(--vi)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{font-weight:600;font-size:.8rem;color:var(--mu);text-align:center;white-space:nowrap;background:#101013;position:sticky;top:0}
td{text-align:center;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stick{position:sticky;left:0;text-align:left;background:var(--bg);z-index:2;min-width:14rem}
th.stick{background:#101013;z-index:3}
tr:hover td{background:#17171b} tr:hover td.stick{background:#17171b}
.best{color:var(--cy);font-weight:600}
.pn{display:block;color:#ff9f43;font-size:.7rem;line-height:1.1}
.flag{display:inline-block;width:1.75rem;height:auto;border-radius:.15rem;box-shadow:0 0 0 1px #3a3a43;margin:0 .15rem;vertical-align:middle}
.veh{display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.veh img{width:1.5rem;height:1.5rem;object-fit:contain}
.num{display:inline-block;min-width:3.1rem;text-align:center;background:var(--vi);padding:.1rem .4rem;border-radius:.3rem;font-size:1.4rem;line-height:1.3}
.cat{font-size:.75rem;border:1px solid var(--cy);color:var(--cy);border-radius:.3rem;padding:0 .35rem;font-weight:600}
.cat-lg{display:inline-block;font-size:1.3rem;border:1.5px solid var(--cy);color:var(--cy);border-radius:.3rem;padding:0 .6rem;line-height:1.35;font-style:italic;font-weight:800;margin-left:.5rem;vertical-align:middle}
.logo{height:5.2rem;width:auto;max-width:100%;display:block}
.sp-top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:flex-end}
.sp-top img{height:auto;width:auto;max-height:32px;max-width:140px;object-fit:contain;display:block}
.sp-top a{display:inline-flex;align-items:center}
#sponsors{max-width:1600px;margin:2.5rem auto 0;padding:0 1rem}
#sponsors h2{text-align:center;text-transform:uppercase;font-size:1.1rem;margin:0 0 1rem;color:var(--mu)}
.sp-grp{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;margin-bottom:12px}
.sp-box{display:flex;align-items:center;justify-content:center;border-radius:.5rem;padding:8px}
.sp-box img{display:block;object-fit:contain;height:auto;width:auto}
.sp-box.l img{max-height:50px;max-width:180px}.sp-box.m img{max-height:38px;max-width:130px}.sp-box.s img{max-height:28px;max-width:90px}
.sp-box.empty{border:1px dashed #44444d;color:var(--mu);font-size:.85rem;text-align:center}
.sp-box.empty.l{width:180px;height:50px}.sp-box.empty.m{width:130px;height:38px}.sp-box.empty.s{width:90px;height:28px;font-size:.7rem}
.sp-box.txt{color:#fff;font-weight:600;padding:0 1rem}
.pos1 .pos{color:var(--cy)}
th.c{text-align:center}
[hidden]{display:none!important}
/* Clasificacion final: tarjetas por categoria */
.fgrid{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:768px){.fgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1280px){.fgrid{grid-template-columns:repeat(3,1fr)}}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;overflow:hidden}
.fc-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.65rem 1rem;background:linear-gradient(100deg,#1b1030,#2a0f4a);border-bottom:2px solid var(--cy)}
.fc-st{font-size:.72rem;border:1px solid var(--cy);color:var(--cy);border-radius:.3rem;padding:.1rem .5rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.fc-st.prov{border-color:#ff9f43;color:#ff9f43}
.fc-r{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.75rem 1rem;border-top:1px solid var(--line)}
.fc-h + .fc-r{border-top:0}
.fc-e{padding:1rem;color:var(--mu);font-size:.9rem}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--cy);box-shadow:0 0 0 0 var(--cy);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 .6rem transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.slot{border:1px dashed #44444d;color:var(--mu);font-size:.75rem;padding:.35rem .9rem;border-radius:.4rem}
td,th{padding:.5rem .45rem}td{font-size:.95rem}.tot{font-size:1.2rem}
@media(max-width:1399px){td,th{padding:.45rem .35rem}td{font-size:.88rem}.stick{min-width:12.5rem}.tot{font-size:1.1rem}.num{min-width:2.6rem;font-size:1.2rem}.pos{font-size:1.6rem!important}}
@media(max-width:1199px){td,th{padding:.4rem .25rem}td{font-size:.8rem}th{font-size:.72rem}.stick{min-width:11rem}.tot{font-size:1rem}.cat{display:none}}
@media(max-width:767px){.tab{font-size:.85rem;padding:.5rem .75rem}.logo{height:4rem}.sp-top{justify-content:center}.sp-top img{max-width:104px}.sp-grp{gap:12px}}
</style>
</head>
<body>
<header class="hero">
  <div class="max-w-[1600px] mx-auto px-4 py-4 grid gap-4 items-center md:grid-cols-[auto_1fr_auto]">
    <div class="flex justify-center md:justify-start"><img class="logo" src="assets/logo-rally-fueguino.png" alt="Rally Fueguino A.PI.TU.R." width="640" height="179"></div>
    <div class="text-center">
      <h1 id="evname" class="ttl text-xl md:text-3xl leading-tight m-0">Cargando evento…</h1>
      <p id="evmeta" class="m-0 mt-2 text-lg" style="color:var(--cy)">A.PI.TU.R.</p>
    </div>
    <div id="sp-top" class="sp-top" aria-label="Sponsors oficiales"></div>
  </div>
</header>

<main class="max-w-[1600px] mx-auto px-4 py-5">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
    <div role="tablist" class="tabs" aria-label="Vista">
      <button class="tab ttl" role="tab" data-v="gen" aria-selected="true">General</button>
      <button class="tab ttl" role="tab" data-v="cat" aria-selected="false">Por categoría</button>
      <button class="tab ttl" role="tab" data-v="e1" aria-selected="false">Etapa 1</button>
      <button class="tab ttl" role="tab" data-v="e2" aria-selected="false">Etapa 2</button>
      <button class="tab ttl" role="tab" data-v="fin" aria-selected="false">Clasificación Final</button>
      <button class="tab ttl" role="tab" data-v="insc" aria-selected="false">Inscriptos</button>
    </div>
    <div class="text-sm leading-tight text-right" aria-live="polite">
      <div class="flex items-center justify-end gap-2 font-semibold text-white"><span class="dot"></span><span>En vivo</span></div>
      <div class="mt-1" style="color:var(--mu)">Última actualización: <b id="upd" class="text-white">--:--:--</b></div>
    </div>
  </div>
  <div id="chips" class="flex flex-wrap gap-2 mb-4" aria-label="Filtro por categoría"></div>
  <p id="note" class="text-sm mb-3" style="color:var(--mu)"></p>
  <div id="fin" class="fgrid" hidden></div>
  <div id="tw" class="overflow-x-auto rounded-lg" style="border:1px solid var(--line)"><table id="tbl"></table></div>
  <p id="foot" class="text-xs mt-3" style="color:var(--mu)">Solo se muestran tiempos netos de cada PE. Un DNF o abandono queda fuera del ordenamiento y no suma como tiempo.</p>
</main>

<section id="sponsors" aria-label="Sponsors"></section>

<script src="sponsors.js"></script>
<script src="footer.js"></script>
<script type="module">
import { state, startLive, toRows, liveEvent, clock } from './03_public-live-timing.js';
import { rank, isN } from './ranking.js';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const f = x => { const h = Math.floor(x / 360000), m = Math.floor(x / 6000) % 60, s = Math.floor(x / 100) % 60, c = x % 100; const p = v => String(v).padStart(2, '0'); return (h ? h + ':' + p(m) : m) + ':' + p(s) + '.' + p(c) };
let view = 'gen', cat = 'all', PES = [], ROWS = [], CATS = [], CREWS = [];

function body(list, a, b) {
  const best = []; for (let i = a; i < b; i++) best[i] = Math.min(...list.map(x => x.c.t[i]).filter(isN));
  return list.map(x => { const c = x.c; return `<tr class="${x.pos === 1 ? 'pos1' : ''}" style="${x.part || x.pos === '-' ? 'opacity:.75' : ''}">
  <td class="stick"><div class="flex items-center gap-3"><span class="sp it pos ${isN(x.pos) ? 'text-3xl' : 'text-lg'} w-9 text-center">${x.pos}</span><span class="sp it num">${c.n}</span>
  <div class="leading-tight"><div class="font-semibold">${esc(c.p)} <span class="cat">${esc(c.cat)}</span></div><div class="text-sm" style="color:var(--mu)">${esc(c.nv)}${c.pe ? ' · ' + esc(c.pe) : ''}</div></div></div></td>
  ${c.t.slice(a, b).map((v, i) => v === 'DNF' ? '<td style="color:#ff6b81">DNF</td>' : v === undefined ? '<td style="color:#55555e">·</td>' : `<td class="${v === best[a + i] ? 'best' : ''}">${f(v)}${c.pen[a + i] ? '<span class="pn">+' + f(c.pen[a + i]) + '</span>' : ''}</td>`).join('')}
  <td class="sp it tot">${x.tot == null ? (x.dnf ? '<span style="color:#ff6b81">DNF</span>' : '--') : f(x.tot) + (x.part ? `<span class="text-xs block" style="color:var(--mu)">${x.done}/${x.K} PE</span>` : '')}</td>
  <td style="color:var(--mu)">${x.gap > 0 ? '+' + f(x.gap) : x.gap === 0 ? '-' : ''}</td></tr>` }).join('');
}

// Banderas: imagen de flagcdn.com por codigo de pais (ISO de 2 letras). Sin dato en la base = Argentina.
const flag = code => `<img class="flag" src="https://flagcdn.com/w40/${esc(String(code).toLowerCase())}.png" alt="${esc(String(code).toUpperCase())}" title="${esc(String(code).toUpperCase())}" loading="lazy" width="28" height="19" onerror="this.replaceWith(document.createTextNode(this.alt))">`;
// Marca del auto = primera palabra del modelo ("Ford Fiesta" -> ford). El logo se busca en assets/brands/<marca>.png; si no esta el archivo, no se muestra.
const BRAND_ALIAS = { volkswagen: 'vw', 'škoda': 'skoda', citroën: 'citroen', mercedes: 'mercedes', 'mercedes-benz': 'mercedes' };
const brand = m => { const w = String(m || '').trim().split(/\s+/)[0].toLowerCase().normalize('NFC'); return BRAND_ALIAS[w] || w.normalize('NFD').replace(/[^a-z0-9]/g, '') };
function vehiculo(m) {
  if (!m) return '<span style="color:#55555e">·</span>';
  const b = brand(m);
  return `<span class="veh">${b ? `<img src="assets/brands/${esc(b)}.png" alt="" onerror="this.remove()">` : ''}<span>${esc(m)}</span></span>`;
}
function inscriptos() {
  const list = CREWS.filter(c => cat === 'all' || c.category === cat).sort((p, q) => p.car_number - q.car_number);
  $('#note').textContent = `${list.length} ${list.length === 1 ? 'tripulación inscripta' : 'tripulaciones inscriptas'}${cat === 'all' ? '' : ' en la categoría ' + cat}.`;
  if (!list.length) { $('#tbl').innerHTML = '<tbody><tr><td>Todavía no hay tripulaciones cargadas para este evento.</td></tr></tbody>'; return }
  $('#tbl').innerHTML = `<thead><tr><th>Nro.</th><th>Nacionalidad</th><th>Piloto</th><th>Navegante</th><th>Vehículo</th><th>Categoría</th><th>Peña</th></tr></thead><tbody>${list.map(c => `<tr>
    <td><span class="sp it num">${esc(c.car_number)}</span></td>
    <td>${flag(c.nationality || 'ar')}${c.co_driver ? flag(c.co_nationality || c.nationality || 'ar') : ''}</td>
    <td class="font-semibold">${esc(c.driver)}</td><td>${esc(c.co_driver)}</td>
    <td>${vehiculo(c.car_model)}</td>
    <td><span class="cat" style="display:inline-block;font-size:.9rem;font-style:italic;font-weight:800">${esc(c.category)}</span></td>
    <td style="color:var(--mu)">${esc(c.team)}</td></tr>`).join('')}</tbody>`;
}

// Clasificacion final: podio (top 3) por categoria. "Finalizado" cuando todas las tripulaciones de la categoria terminaron o abandonaron.
function final() {
  const n = PES.length, ks = CATS.filter(k => cat === 'all' || k === cat), car = new Map(CREWS.map(c => [c.car_number, c]));
  $('#note').textContent = 'Top 3 de cada categoría con los tiempos validados. Mientras haya tripulaciones en carrera, el podio es provisorio.';
  if (!ks.length) { $('#fin').innerHTML = '<p class="fc-e">Todavía no hay tiempos validados para este evento.</p>'; return }
  $('#fin').innerHTML = ks.map(k => {
    const rows = ROWS.filter(c => c.cat === k);
    const top = rank(rows, 0, n).filter(x => isN(x.pos)).slice(0, 3);
    const closed = n > 0 && rows.every(c => c.t.includes('DNF') || c.t.every(isN));
    const list = top.map(x => {
      const c = x.c, veh = car.get(c.n)?.car_model || c.pe || '';
      const right = x.pos === 1 ? `<span class="sp it" style="font-size:1.5rem;color:var(--cy)">${f(x.tot)}</span>`
        : x.part ? `<span class="text-sm" style="color:var(--mu)">${x.done}/${x.K} PE</span>`
        : `<span class="sp it" style="font-size:1.3rem;color:var(--mu)">+${f(x.gap)}</span>`;
      return `<div class="fc-r"><span class="sp it num">${x.pos}</span>
        <div class="leading-tight min-w-0"><div class="font-semibold">${esc(c.p)}</div><div class="text-sm" style="color:var(--mu)">${esc(c.nv)}</div>
        <div class="text-xs mt-1" style="color:var(--mu)">#${esc(c.n)}${veh ? ' · ' + esc(veh) : ''}</div></div>${right}</div>`;
    }).join('') || '<p class="fc-e">Sin tiempos validados todavía.</p>';
    return `<article class="fc"><div class="fc-h"><h3 class="ttl text-lg m-0">${esc(k)}</h3><span class="fc-st ${closed ? '' : 'prov'}">${closed ? 'Finalizado' : 'Provisorio'}</span></div>${list}</article>`;
  }).join('');
}

function render() {
  const fin = view === 'fin';
  $('#foot').hidden = view === 'insc' || fin;
  $('#tw').hidden = fin; $('#fin').hidden = !fin;
  if (fin) { final(); return }
  if (view === 'insc') { inscriptos(); return }
  if (!ROWS.length) { $('#tbl').innerHTML = '<tbody><tr><td style="text-align:left">Todavía no hay tripulaciones cargadas para este evento.</td></tr></tbody>'; return }
  const n = PES.length, s2 = PES.findIndex(p => p.stages?.number === 2);
  const [a, b] = view === 'e2' && s2 >= 0 ? [s2, n] : view === 'e1' ? [0, s2 > 0 ? s2 : n] : [0, n];
  const rows = ROWS.filter(c => cat === 'all' || c.cat === cat);
  const lastCol = view === 'e1' ? 'Etapa 1' : view === 'e2' ? 'Etapa 2' : 'Acumulado';
  let html = `<thead><tr><th class="stick">Pos / Auto / Tripulación</th>${PES.slice(a, b).map(p => `<th class="c">${esc(p.name)}</th>`).join('')}<th>${lastCol}</th><th>Diferencia</th></tr></thead>`;
  const cols = b - a + 3;
  if (view === 'cat') CATS.filter(k => cat === 'all' || k === cat).forEach(k => {
    html += `<tbody><tr><td colspan="${cols}" class="ttl text-lg" style="background:#1b1030;text-align:left;border-left:4px solid var(--vi)">Categoría <span class="cat-lg">${esc(k)}</span></td></tr>${body(rank(rows.filter(c => c.cat === k), a, b), a, b)}</tbody>`;
  }); else html += `<tbody>${body(rank(rows, a, b), a, b)}</tbody>`;
  $('#tbl').innerHTML = html;
  $('#note').textContent = view === 'e2' && s2 < 0 ? 'Esta fecha todavía no tiene Etapa 2 cargada.' :
    view === 'e1' && s2 === 0 ? 'Esta fecha todavía no tiene Etapa 1 cargada.' :
    { gen: `Acumulado de las PE corridas hasta ahora (PE${a + 1} a PE${b}). Quien tiene menos PE completadas va debajo, atenuado.`,
      cat: 'Posiciones dentro de cada categoría. La diferencia es contra el líder de la categoría.',
      e1: 'Etapa 1 independiente: suma solo de sus PE.',
      e2: 'Etapa 2 independiente: suma solo de sus PE.' }[view];
}
function chips() {
  $('#chips').innerHTML = ['all', ...CATS].map(k => `<button class="chip text-lg" data-c="${esc(k)}" aria-pressed="${k === cat}">${k === 'all' ? 'Todas' : esc(k)}</button>`).join('');
}
$('#chips').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; chips(); render() };
document.querySelector('[role=tablist]').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; view = b.dataset.v; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b)); render() };

function onData(st) {
  PES = st.stages; ROWS = toRows(st); CREWS = [...st.crews.values()];
  const cs = [...new Set(ROWS.map(r => r.cat))].sort();
  if (cs.join() !== CATS.join()) { CATS = cs; chips() }
  $('#upd').textContent = clock(st.last);   // hora del ultimo dato validado, no del reloj del equipo
  render();
}
// Encabezado desde la base: nombre, sede y fechas del evento ('YYYY-MM-DD', sin conversion de zona horaria).
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechas(a, b) {
  if (!a) return '';
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = (b || a).split('-').map(Number);
  if (a === (b || a)) return `${d1} de ${MESES[m1 - 1]}`;
  if (m1 === m2 && y1 === y2) return `${d1} y ${d2} de ${MESES[m1 - 1]}`;
  return `${d1} de ${MESES[m1 - 1]} al ${d2} de ${MESES[m2 - 1]}`;
}
function header(ev) {
  $('#evmeta').textContent = ['A.PI.TU.R.', ev.venue, fechas(ev.starts_on, ev.ends_on)].filter(Boolean).join(' · ');
  $('#evname').textContent = ev.name;
  document.title = `${ev.name} - Rally Fueguino Live Timing`;
}
// Sponsors: se leen de sponsors.js (arriba y abajo).
function sponsors() {
  const S = window.SPONSORS || {};
  const link = (x, inner) => x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(x.name)}">${inner}</a>` : inner;
  $('#sp-top').innerHTML = (S.top || []).slice(0, 4).map(x => link(x, x.logo
    ? `<img src="${esc(x.logo)}" alt="${esc(x.name)}" loading="lazy">` : `<span class="slot">${esc(x.name)}</span>`)).join('');
  const groups = ['l', 'm', 's'].map(k => {
    const real = (S.bottom || []).filter(x => (x.size || 'm') === k);
    const empty = S.showPlaceholders ? Math.max(0, (S.slots?.[k] || 0) - real.length) : 0;
    const boxes = real.map(x => link(x, x.logo ? `<span class="sp-box ${k}"><img src="${esc(x.logo)}" alt="${esc(x.name)}" loading="lazy"></span>` : `<span class="sp-box ${k} txt">${esc(x.name)}</span>`))
      .concat(Array.from({ length: empty }, () => `<span class="sp-box empty ${k}">Tu marca acá</span>`));
    return boxes.length ? `<div class="sp-grp">${boxes.join('')}</div>` : '';
  }).join('');
  $('#sponsors').innerHTML = groups ? `<h2 class="ttl">${esc(S.bottomTitle || 'Sponsors')}</h2>${groups}` : '';
}
sponsors();
chips();
try {
  const ev = await liveEvent();
  if (ev) { header(ev); startLive(ev.id, onData) } else { $('#evname').textContent = 'Sin evento en vivo'; $('#note').textContent = 'No hay un evento en vivo en este momento.' }
} catch (e) { console.error(e); $('#note').textContent = 'No pudimos conectar con el servidor. Reintentá en unos segundos.' }
</script>
</body>
</html>
